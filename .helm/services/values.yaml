secrets:
  keycloak_certs_endpoint:
    secretName: keycloak-certs-endpoint
  deps_api_gateway:
    secretName: deps-api-gateway
  telemetry_secrets:
    secretName: telemetry-secrets
  deps_litellm:
    secretName: deps-litellm

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: "/base/kubernetes-helm"
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  resources: {}

registry: ""
env: ""


api_gateway:
  replicaCount: 1
  image:
    path: "/deps-dev-x01/deps-api-gateway"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  service:
    type: ClusterIP
    port: 8000
  resources: {}
#    limits:
#      cpu: 200m
#      memory: 800Mi
#    requests:
#      cpu: 100m
#      memory: 350Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

certs_location:
  certs_default_path: "/tmp/ssl"

api_gateway_settings:
    ENV: dev

    AUTH_VERIFY_SSL: false

    LOG_LEVEL: "INFO"
    DOCUMENTATION_ENABLED: "true"

    CORLEONE_URL: "http://corleone:8000"
    PREPROCESS_URL: "http://preprocess-api:8000"
    DOCUMENT_URL: "http://backend:8000"
    DOCUMENT_TYPE_URL: "http://document-type:8000"
    UNIFIER_URL: "http://unifier:8000"
    EXTRACTION_URL: "http://extraction:8000"
    WORKFLOW_MANAGER_URL: "http://workflow-manager:8000"
    IAM_URL: "http://iam:8000"
    OCR_URL: "http://ocr:8000"
    PROTOTYPE_URL: "http://prototype:8000"
    PARSING_URL: 'http://parsing:8000'
    ENRICHMENT_URL: 'http://enrichment:8000'
    PROMPTER_URL: 'http://prompter:8000'
    HIGH_SPARROW_URL: 'http://high-sparrow:8000'
    OUTPUT_EXPORTING_URL: 'http://output-exporting:8000'
    VALIDATION_URL: 'http://validation:8005'
    AI_FUSION_URL: 'http://ai-fusion:8000'
    TEMPLATE_URL: 'http://template:8000'
    GROUPS_URL: 'http://groups:8000'
    CLASSIFICATION_URL: 'http://classification:8000'
    CLOUD_NATIVE_EXTRACTION_URL: 'http://cloud-native-extraction:8000'
    STORAGE_URL: 'http://file-storage:8004'
    DEFAULT_STORAGE : 'FILE_STORAGE'
    FILES_BATCH_URL: 'http://files-batch:8000'
    EVENT_RELAY_URL: 'http://event-relay:8000'
    AGENTIC_AI_URL: 'http://agentic-ai:8000'
    FILE_URL: 'http://file:8000'
    META_AGENT_URL: 'http://meta-agent:8000'
    SEMANTIC_PARSING_URL: 'http://semantic-parsing:8000'
    SPLITTING_URL: 'http://splitting:8000'
    ANALYTIC_URL: 'http://analytic:8000'
    LITELLM_URL: 'http://deps-litellm:4000'

    AUTHORIZATION_ENABLED: False

    # Telemetry
    INSTRUMENTATION_ENABLED: false
    SERVICE_NAME: deps-api-gateway
    EXPORTER_TYPE: azure

