helm:
  enabled: true

csi:
  csi_default_name: deps-api-gateway
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

secret_project_id:
  id: ""

azure_kv_settings:
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  resourceGroup: ""
  subscriptionId: ""

# Enabled vault settings means that secrets are pulled from hashicorp vault server. Turn off this setting by changing true to false if you are using this repo in another project. If you haven't integrated your cluster with vault deploy won't work.
vault_settings:
  enabled: false
  hashicorp_vault: false
  azure_key_vault: false
  gcp_secret_manager: false
  aws_secret_manager: false
  aws_secret_manager_region: ''

vault_enabled_api_gateway:
  env:
  - name: AUTH_CERTS_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: deps-api-gateway
        key: keycloak-certs-endpoint
  - name: WORKFLOW_V2
    valueFrom:
      secretKeyRef:
        name: deps-api-gateway
        key: workflow-v2
  - name: CSRF_PROTECTION_ENABLED
    valueFrom:
      secretKeyRef:
        name: deps-api-gateway
        key: csrf-protection-enabled
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: deps-api-gateway
        key: app-secret-key
  - name: LITELLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: deps-litellm
        key: litellm-master-key

vault_disabled_api_gateway:
  env:
  - name: AUTH_CERTS_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: keycloak-certs-endpoint
        key: keycloak-certs-endpoint
  - name: WORKFLOW_V2
    valueFrom:
      secretKeyRef:
        name: feature-flags
        key: workflow_v2
  - name: CSRF_PROTECTION_ENABLED
    valueFrom:
      secretKeyRef:
        name: feature-flags
        key: csrf-protection-enabled
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: app-secret-key
        key: app-secret-key
  - name: LITELLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: deps-litellm
        key: litellm-master-key
