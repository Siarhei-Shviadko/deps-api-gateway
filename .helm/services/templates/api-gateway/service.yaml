apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    {{- include "deps-api-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api_gateway.service.type }}
  ports:
    - port: {{ .Values.api_gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-api-gateway.selectorLabels" . | nindent 4 }}
