apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    {{- include "deps-api-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api_gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "deps-api-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "deps-api-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.api_gateway.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.api_gateway.imagePullSecrets }}
      {{- end }}
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if or .Values.vault_settings.hashicorp_vault .Values.vault_settings.gcp_secret_manager .Values.vault_settings.aws_secret_manager }}
      serviceAccountName: {{ .Values.service_account.serviceAccountName }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: '{{ .Values.registry }}{{ .Values.api_gateway.image.path }}:{{ .Values.api_gateway.image.tag | default "latest" }}'
          imagePullPolicy: {{ .Values.api_gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.api_gateway.resources | nindent 12 }}
          envFrom:
          - configMapRef:
              name: api-gateway-configmap
              optional: false
          env:
          {{- if .Values.api_gateway_settings.INSTRUMENTATION_ENABLED }}
            {{- if eq .Values.api_gateway_settings.EXPORTER_TYPE "azure" }}
            - name: APPLICATION_INSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.telemetry_secrets.secretName }}
                  key: application-insights-connection-string
            {{- end }}
          {{- end }}
          {{- if .Values.vault_settings.enabled }}
          {{- toYaml .Values.vault_enabled_api_gateway.env | nindent 12 }}
          {{- else }}
          {{- toYaml .Values.vault_disabled_api_gateway.env | nindent 12 }}
          {{- end }}
          volumeMounts:
          {{- if .Values.vault_settings.enabled }}
            - name: secrets-store-inline
              mountPath: {{ .Values.secrets_location.secrets_default_path }}
              readOnly: true
          {{- end }}
      volumes:
      {{- if .Values.vault_settings.enabled }}
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.csi.csi_default_name }}
      {{- end }}
      {{- with .Values.api_gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api_gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api_gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
