{{- if .Values.vault_settings.hashicorp_vault  }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: vault
  secretObjects:
  - data:
    - key: keycloak-certs-endpoint
      objectName: keycloak-certs-endpoint
    - key: workflow-v2
      objectName: workflow-v2
    secretName: {{ .Values.secrets.deps_api_gateway.secretName }}
    type: Opaque
  parameters:
    roleName: {{ .Values.csi.roleName }}
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    objects: |
      - objectName: "keycloak-certs-endpoint"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "keycloak-certs-endpoint"

      - objectName: "workflow_v2"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/feature-flags"
        secretKey: "workflow_v2"
{{- end }}
