version: "3.4"

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./etc/api-gateway/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "api-gateway-dev:latest"
    env_file:
      - ./etc/api-gateway/env/.dev.env
      - .env
    networks:
      - deps-network
    ports:
      - 8019:8000
    volumes:
      - ./src/deps_api_gateway:/app/deps_api_gateway
      - ./src/tests:/app/tests
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
      - ./src/setup.cfg:/app/setup.cfg
    environment:
      WDB_SOCKET_SERVER: wdb
      WDB_NO_BROWSER_AUTO_OPEN: "True"
    stdin_open: true
    tty: true

networks:
  deps-network:
    external: true
