[tool.poetry]
name = "deps_api_gateway"
version = "0.1.0"
description = "Api Gateway package used to manage frontend requests"
authors = []

[tool.poetry.dependencies]
python = "~3.12"
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0"
click = "^8.1.3"
dependency-injector = "^4.48.0"
fastapi = "^0.120"
uvicorn = "^0.18.3"
cachetools = "^5.3.0"
aiohttp = "^3.13.3"

async-rest-client = { path = "../vendors/deps-async-rest-client", develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
python-multipart = "^0.0.22"
more-itertools = "^9.1.0"
fastapi-csrf-protect = ">=1.0.6"
httpx = "^0.27"
asgi-lifespan = "^2.1.0"
starlette = "^0.49.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^8.3"
coverage = "^5.5"
pytest-mock = "~3.7.0"
pytest-factoryboy = "^2.5.1"
pytest-asyncio = "^1.2.0"
async-asgi-testclient = "^1.4.11"
aioresponses = ">=0.7.4,<0.7.8"
types-cachetools = "^5.3.0.7"
types-requests = "^2.30"

# Debug utils
ipdb = "^0.13.11"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.poetry.extras]
async-rest-client = ["async-rest-client"]


[tool.pytest.ini_options]
markers = [
    "storage",
    "ai_fusion",
    "document_types",
    "document",
    "documents",
    "document_list",
    "enrichment",
    "groups",
    "iam_endpoints",
    "ocr",
    "utput_exporting",
    "parsing",
    "output_exporting",
    "prompter",
    "prototype",
    "template",
    "unifier",
    "validation",
    "batches",
    "event_router",
    "files",
]

