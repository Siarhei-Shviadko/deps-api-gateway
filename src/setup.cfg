[tool:pytest]
rootdir = .
cache_dir = /tmp/test_cache/.pytest_cache

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

[flake8]
ignore=
    # Class without a base class
    WPS306,
    # Found `f` string
    WPS305
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Found empty comment
    WPS464,
    # Found local folder import
    WPS300,
    # Found `__init__.py` module with logic
    WPS412,
    # Found `else` in a loop without `break`
    WPS500,
    # Found too short name: x
    WPS111,
    # Found function with too much cognitive complexity NEED TO GOOGLE AND SET COGNITIVE
    WPS231,
    # Found incorrectly nested ternary
    WPS509,
    # Found too many imported names from a module
    WPS235,
    # Found string constant over-use
    WPS226,
    # Found a line that starts with a dot
    WPS348,
    # Found multiline conditions
    WPS337,
    # Found module with too many imports
    WPS201,
    # Found using `@staticmethod`
    WPS602,
    # Requests call with verify=False disabling SSL certificate checks, security issue
    S501,
    # Found too long ``try`` body length
    WPS229,
    # line break before binary operator
    W503,
    # Found a too complex `f` string
    WPS237,
    # Found a getter without a return value
    WPS463,
    # Found subclassing a builtin: str
    WPS600,
    # Do not perform function calls in argument defaults. This rule prevents us from using the recommended style of dependency_injector
    B008,
    # Found too many arguments
    WPS211,
    # Found complex default value
    WPS404,
    # Found nested class: Config
    WPS431,
    # Found too many expressions
    WPS213,
    # Found upper-case constant in a class
    WPS115,
    # Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # Found wrong keyword: pass
    WPS420,
    # Missing trailing comma
    C812,
    # Found overly complex annotation
    WPS234,
    # Found too long name
    WPS118,
    # Found shadowed class attribute
    WPS601,
    # Found wrong function call
    WPS421,
    # Found incorrect node inside class body
    WPS604,
    # Found walrus operator
    WPS332,
    # Found string formatting
    WPS323,
    # Found wrong metadata variable: __all__
    WPS410,
    # Found implicit string concatenation
    WPS326,
    N818,
    S113,
    C416,
    WPS467,
    B024,
    WPS473,

allowed-domain-names =
    value,  # We allow using 'value' name when creating dictionaries
    file,   # We are working with files
    data,   # We use name 'data' in our models
    info    # We use it in settings
    content, # We use it in file context
    params,  # We use it in proxies as query params
    result,  # We use it in serializers

exclude =
    .git,
    __pycache__,
    vendors,
    .venv,
    tests,
    __init__.py,

per-file-ignores =
  # There are multiple `assert`s in tests, we allow them:
  src/tests/*.py: S101
  */__init__.py: F401
  deps_api_gateway/api/endpoints/v1/routers/corleone.py: WPS214
  ./deps_api_gateway/api/endpoints/v1/routers/document.py: WPS214
  ./deps_api_gateway/api/endpoints/v1/routers/corleone.py: WPS214
  # WPS328: Found useless node: try
  # WPS329: Found useless `except` case
  ./deps_api_gateway/application/legacy/document/raise_all.py: WPS328, WPS329
    # N815: Variable has to be mixed case, bc it's a response from proxies
  ./deps_api_gateway/application/legacy/document/typehints/*.py: N815
  # WPS217: Too many await exceptions,too many vars to unpack a tuple
  # WPS236: Found too many variables used to unpack a tuple: 7 > 4
  ./deps_api_gateway/application/legacy/document/document.py: WPS217, WPS236
  # WPS110 Found wrong variable name: parameters
  ./deps_api_gateway/api/serializers/v5/unifier/transformations.py: WPS110
  # WPS428 Found statement that has no effect
  ./deps_api_gateway/application/*proxy.py: WPS428
  # Temporary logic with getting request._request attribute
  ./deps_api_gateway/api/endpoints/v1/routers/prototype/helper.py: WPS437
  # Access protected static methods of the same class
  ./deps_api_gateway/application/document_type/consolidator.py: WPS437, WPS352
  # variable '...' in class scope should not be mixedCase
  ./deps_api_gateway/application/document/dtos/*: N815
  ./deps_api_gateway/application/types/extracted_data/field_data/*: N815
  ./deps_api_gateway/application/types/insights_request_params.py: N815
  ./deps_api_gateway/application/types/llm_extraction_params.py: N815
  # Found module with too many imported names: 53 > 50
  ./deps_api_gateway/containers.py: WPS203
  ./deps_api_gateway/extras/*: WPS425, WPS110
  # Found too many methods: 22 > 20
  ./deps_api_gateway/application/document_type/service.py: WPS214, WPS424, WPS217
  ./deps_api_gateway/application/document/service.py: WPS214
  # Found overused expression: ...; used 13 > 10
  ./deps_api_gateway/infrastructure/proxies/document/proxy.py: WPS204
  # Access protected static methods of the same class; Found multiline loop
  ./deps_api_gateway/application/document/consolidator.py: WPS352, WPS437
  ./deps_api_gateway/application/document_type/prototype/consolidator.py: WPS437
  ./deps_api_gateway/api/endpoints/v5/document/document.py: WPS202, WPS204
  ./deps_api_gateway/application/iproxies/iam.py: WPS428
  ./deps_api_gateway/application/iproxies/icloud_native_extraction.py: WPS428
  ./deps_api_gateway/api/endpoints/v5/iam/organisations.py: WPS202, WPS204
  ./deps_api_gateway/api/endpoints/v5/groups/groups.py: WPS202, WPS204
  ./deps_api_gateway/api/serializers/v5/ai_fusion/retrieve_insights.py: E501
  ./deps_api_gateway/application/types/unified_cells.py: N815
  ./deps_api_gateway/api/serializers/v5/agentic_ai/conversation.py: WPS202, WPS110
  ./deps_api_gateway/api/endpoints/v5/agentic_ai/sse/conversation.py: WPS232
  ./deps_api_gateway/api/endpoints/v5/file/file.py: WPS202, WPS204
  ./deps_api_gateway/application/file/service.py: WPS214
  ./deps_api_gateway/application/iam/service.py: WPS214
  ./deps_api_gateway/application/iproxies/iam_proxy.py: WPS214, WPS428
  ./deps_api_gateway/infrastructure/proxies/iam/proxy.py: WPS214

max-local-variables = 15
max-methods = 20
max-line-length = 130
max-module-members = 10
max-module-expressions = 10
max-line-complexity = 16

# radon section
radon-max-cc = 10
radon-show-closures = True
radon-no-assert = True

# to disable false positive N805
classmethod-decorators =
    classmethod
    validator
    root_validator

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined, has-type

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /vendors/*
    /app/.venv/*
branch = True
data_file=/tmp/test_cache/.coverage

[coverage:report]
fail_under = 70

[ipdb]
context = 21
